[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goldbot"
version = "0.1.0"
description = "Quantamental XAUUSD bot: manifest, headless validator, and strategy foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Proprietary"
authors = [{ name = "Gold Quantamental Project" }]
dependencies = [
  "PyYAML==6.0.3",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "MetaTrader5==5.0.6147",
  "python-dateutil==4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
]

[project.scripts]
goldbot = "goldbot.cli:main"

[tool.setuptools.packages.find]
include = ["goldbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
